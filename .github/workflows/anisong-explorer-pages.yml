name: AniSong Explorer - build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/anisong-explorer/**'
      - '.github/workflows/anisong-explorer-pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0' # Weekly refresh (Sunday, UTC)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: anisong-explorer-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build SQLite catalog (live API, fall back to official sample)
        run: python apps/anisong-explorer/scripts/build_catalog.py --source auto --output apps/anisong-explorer/site/data/catalog.sqlite
      - name: Bundle sql.js locally (no runtime CDN dependency)
        run: |
          npm install --no-save --no-package-lock sql.js@1.13.0
          mkdir -p apps/anisong-explorer/site/vendor
          cp node_modules/sql.js/dist/sql-wasm.js apps/anisong-explorer/site/vendor/sql-wasm.js
          cp node_modules/sql.js/dist/sql-wasm.wasm apps/anisong-explorer/site/vendor/sql-wasm.wasm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/anisong-explorer/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
