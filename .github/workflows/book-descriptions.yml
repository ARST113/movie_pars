name: Backfill book descriptions

on:
  push:
    paths:
      - '.github/workflows/book-descriptions.yml'
      - 'book_descriptions/**'
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: "Max book rows per shard (1500 covers the entire remaining database)"
        required: false
        type: number
        default: 1500
      dry_run:
        description: "Read-only preview (no descriptions written)"
        required: false
        type: boolean
        default: false

concurrency:
  group: book-descriptions-google-sheet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    if: ${{ vars.BOOK_DESCRIPTIONS_ENABLED != 'false' }}
    name: Books shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SPREADSHEET_ID: '1EhKpBf0VHW_kBVMgIwZv0_cE4-jtLhm9OYZMDGUqwpw'
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'google/gemini-2.5-flash-lite' }}
      USE_BROWSER: 'true'
      WORKERS: '4'
      BATCH_SIZE: '100'
      CLOUD_BUDGET_SECONDS: '14800'
      INPUT_LIMIT: ${{ inputs.limit || 1500 }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: book_descriptions/requirements.txt
      - name: Install Python, Firecrawl client dependencies and Chromium
        run: |
          python -m pip install -r book_descriptions/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify parser, batch API handling and spreadsheet column logic
        run: python -m unittest discover -s book_descriptions/tests -v
      - name: Check Google credentials and optional Firecrawl fallback
        shell: bash
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "Missing GOOGLE_SERVICE_ACCOUNT_JSON" >&2; exit 2; }
          if [ -n "$FIRECRAWL_API_KEY" ]; then
            echo "Firecrawl cloud fallback enabled: 100 URLs per batch, two shards concurrently, respect API 429 Retry-After."
          else
            echo "Firecrawl secret is absent; direct HTTP and Chromium collection will continue."
          fi
      - name: Direct plus browser collection, then official Firecrawl Batch Scrape
        shell: bash
        run: |
          ARGS=(--shard "${{ matrix.shard }}" --shards 4 --limit "$INPUT_LIMIT")
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -u book_descriptions/batch_backfill.py "${ARGS[@]}"
      - name: Upload batch progress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-description-batch-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: batch-description-report-*.json
          if-no-files-found: ignore
          retention-days: 14
