name: Cloudflare WARP probe — book pages

on:
  push:
    branches:
      - test/cloudflare-warp-probe-20261113
    paths:
      - .github/workflows/cloudflare-warp-probe.yml

permissions:
  contents: read

jobs:
  probe:
    name: Compare direct access and Cloudflare WARP
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4

      - name: Install parser and Chromium
        run: |
          python -m pip install -r book_descriptions/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Probe publisher pages without WARP
        env:
          PROBE_MODE: direct
        run: python book_descriptions/warp_network_probe.py

      - name: Install and connect Cloudflare WARP
        id: warp
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(. /etc/os-release && echo "$VERSION_CODENAME") main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo systemctl enable --now warp-svc
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp+doh
          warp-cli --accept-tos connect

          connected=false
          for attempt in $(seq 1 45); do
            trace="$(curl -fsS --max-time 8 https://www.cloudflare.com/cdn-cgi/trace || true)"
            if printf '%s\n' "$trace" | grep -qx 'warp=on'; then
              connected=true
              break
            fi
            sleep 2
          done

          if [ "$connected" != true ]; then
            echo "MASQUE/default connection did not reach warp=on; trying WireGuard."
            warp-cli --accept-tos disconnect || true
            warp-cli --accept-tos tunnel protocol set WireGuard
            warp-cli --accept-tos connect
            for attempt in $(seq 1 45); do
              trace="$(curl -fsS --max-time 8 https://www.cloudflare.com/cdn-cgi/trace || true)"
              if printf '%s\n' "$trace" | grep -qx 'warp=on'; then
                connected=true
                break
              fi
              sleep 2
            done
          fi

          warp-cli --version
          warp-cli --accept-tos status
          if [ "$connected" != true ]; then
            echo "Cloudflare WARP tunnel did not become active."
            exit 1
          fi
          printf '%s\n' "$trace" | grep -E '^(warp|loc|colo)='

      - name: Probe the same publisher pages through WARP
        if: steps.warp.outcome == 'success'
        env:
          PROBE_MODE: warp
        run: python book_descriptions/warp_network_probe.py

      - name: Disconnect WARP before artifact upload
        if: always()
        run: |
          if command -v warp-cli >/dev/null 2>&1; then
            sudo warp-cli --accept-tos disconnect || true
            sudo systemctl stop warp-svc || true
          fi

      - name: Print comparison
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("warp-probe-results.json")
          if not path.exists():
              print("No probe results were produced.")
              raise SystemExit(0)
          rows = json.loads(path.read_text(encoding="utf-8"))
          for mode in ("direct", "warp"):
              part = [r for r in rows if r["mode"] == mode]
              if not part:
                  print(f"{mode}: not run")
                  continue
              ok = sum(bool(r["ok"]) for r in part)
              print(f"{mode}: {ok}/{len(part)} pages extracted")
              by_domain = {}
              for row in part:
                  stats = by_domain.setdefault(row["domain"], [0, 0])
                  stats[0] += int(bool(row["ok"]))
                  stats[1] += 1
              for domain, (success, total) in sorted(by_domain.items()):
                  print(f"  {domain}: {success}/{total}")
          PY

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-warp-book-page-probe
          path: warp-probe-results.json
          if-no-files-found: warn
          retention-days: 7
