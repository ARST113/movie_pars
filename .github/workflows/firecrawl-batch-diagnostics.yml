name: Diagnose Firecrawl batch failures
on:
  push:
    paths:
      - '.github/workflows/firecrawl-batch-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FIRECRAWL_API_KEY: \${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP, parsing and Chromium dependencies
        run: |
          python -m pip install -r book_descriptions/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Retrieve failed URLs and compare HTTP with Chromium
        run: python -u book_descriptions/diagnose_firecrawl_failures.py
      - name: Upload full diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firecrawl-run-17-diagnostic
          path: firecrawl-diagnostic-report.json
          if-no-files-found: warn
          retention-days: 30
