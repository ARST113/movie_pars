name: Diagnose Firecrawl batch failures # verify refreshed Firecrawl key
on:
  push:
    paths:
      - '.github/workflows/firecrawl-batch-diagnostics.yml'
      - '.github/scripts/diagnose_failed_batch_urls.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP, parsing and Chromium dependencies
        run: |
          python -m pip install -r book_descriptions/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Retrieve exact failed URLs and compare HTTP with Chromium
        run: python -u .github/scripts/diagnose_failed_batch_urls.py
      - name: Upload exact failed-URL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firecrawl-run-17-failed-url-diagnostic
          path: firecrawl-run-17-failed-url-diagnostic.json
          if-no-files-found: warn
          retention-days: 30
