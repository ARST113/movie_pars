name: Recover Labirint rejected annotations from cached Firecrawl results
on:
  push:
    paths:
      - '.github/workflows/replay-firecrawl-annotations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SPREADSHEET_ID: '1EhKpBf0VHW_kBVMgIwZv0_cE4-jtLhm9OYZMDGUqwpw'
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r book_descriptions/requirements.txt
      - name: Run parsing regressions
        run: python -m unittest discover -s book_descriptions/tests -v
      - name: Recover existing cached book descriptions (GET only)
        run: |
          python -u book_descriptions/replay_batch_descriptions.py \
            --job 01a1d3a2-8b27-77ed-98c7-f3acc5577d49 \
            --job 01a1d3a2-8b7f-7688-84e0-f3f513570c38
      - name: Upload recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-book-annotations
          path: replay-book-annotations-report.json
          if-no-files-found: ignore
